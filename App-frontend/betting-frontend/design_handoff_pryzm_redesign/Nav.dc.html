<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:40;background:var(--sf);border-bottom:1px solid var(--bd)">
  <div style="max-width:1240px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:16px;min-width:0">
    <a href="{{ homeHref }}" style="display:flex;align-items:center;gap:9px;flex:none;color:var(--tx);text-decoration:none">
      <img src="assets/pryzm-icon.svg" alt="Pryzm" style="width:28px;height:28px;display:block"></img>
      <span style="font-size:17px;font-weight:650;letter-spacing:-0.02em">Pryzm</span>
    </a>
    <div style="flex:1 1 0;max-width:420px;min-width:38px;height:38px;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;column-gap:10px;padding:0 12px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd);color:var(--mu);font-size:14px">
      <div style="height:36px;display:flex;align-items:center;flex:none"><div style="width:11px;height:11px;border:1.6px solid currentColor;border-radius:50%"></div></div>
      <span style="height:36px;line-height:36px;flex:1 0 100px;white-space:nowrap">Search markets</span>
    </div>
    <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:0;flex:none">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="flex:none;white-space:nowrap;padding:7px 8px;border-radius:8px;font-size:14px;font-weight:{{ l.weight }};color:{{ l.color }};background:{{ l.bg }};text-decoration:none" style-hover="color:var(--tx)">{{ l.label }}</a>
        </sc-for>
      </nav>
    </sc-if>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;flex:none">
      <button onClick="{{ onToggleTheme }}" title="Toggle theme" style="width:36px;height:36px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0" style-hover="background:var(--sf2)">
        <div style="width:14px;height:14px;border-radius:50%;border:1.6px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)"></div>
      </button>
      <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:8px">
          <a href="Wallet.dc.html" style="display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--bd);color:var(--tx);text-decoration:none" style-hover="background:var(--sf2)">
            <div style="width:14px;height:14px;border-radius:50%;background:var(--am);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)"></div>
            <span style="font:600 14px 'Geist Mono',monospace;letter-spacing:-0.02em">12,480</span>
                      </a>
          <a href="Wallet.dc.html" style="height:36px;padding:0 14px;border-radius:9px;background:var(--pr);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;text-decoration:none" style-hover="background:var(--prh);color:#fff">Add funds</a>
          <div style="display:flex;align-items:center;gap:6px;padding:0 4px 0 6px;height:36px;cursor:pointer">
            <div style="width:30px;height:30px;border-radius:50%;background:var(--prs);color:var(--prt);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:650">A</div>
            <div style="width:6px;height:6px;border-right:1.5px solid var(--mu);border-bottom:1.5px solid var(--mu);transform:rotate(45deg) translateY(-2px)"></div>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:6px">
          <a href="Dashboard.dc.html" style="height:36px;padding:0 14px;border-radius:9px;color:var(--tx2);font-size:14px;font-weight:500;display:flex;align-items:center;text-decoration:none" style-hover="color:var(--tx)">Log in</a>
          <a href="Dashboard.dc.html" style="height:36px;padding:0 16px;border-radius:9px;background:var(--pr);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;text-decoration:none" style-hover="background:var(--prh);color:#fff">Sign up</a>
        </div>
      </sc-if>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:60},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;loggedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToggleTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const defs = [['Dashboard','Dashboard.dc.html'],['Markets','Markets.dc.html'],['Portfolio','Portfolio.dc.html'],['News','News.dc.html'],['Tournaments','#']];
    const links = defs.map(([label, href]) => {
      const on = label === active;
      return { label, href, weight: on ? 600 : 500, color: on ? 'var(--tx)' : 'var(--mu)', bg: on ? 'var(--sf2)' : 'transparent' };
    });
    const loggedIn = this.props.loggedIn !== false;
    return { links, loggedIn, loggedOut: !loggedIn, homeHref: loggedIn ? 'Dashboard.dc.html' : 'Landing.dc.html', onToggleTheme: this.props.onToggleTheme };
  }
}
</script>
</body>
</html>
