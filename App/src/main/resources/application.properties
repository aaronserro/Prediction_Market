spring.application.name=fantasy-betting-app
# === datasource (dev) ===
spring.datasource.url=jdbc:postgresql://localhost:5432/betting
spring.datasource.username=postgres
spring.datasource.password=yourpass

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Existing local databases remain Hibernate-managed. The production profile
# enables Flyway and switches Hibernate to schema validation only.
spring.flyway.enabled=false

# (optional) app port
server.port=8080

# Browser security defaults for local development. Production overrides these
# values with an exact HTTPS origin and secure cookies.
app.security.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
app.security.cookie-name=betauth
app.security.cookie-secure=false
app.security.cookie-same-site=Lax
app.security.jwt-lifetime=15m
app.security.jwt-issuer=pryzm-api
app.security.jwt-audience=pryzm-web

# Signup bonus is disabled by default. Enable only after choosing an abuse-control policy;
# configuration changes take effect on application restart.
app.financial.signup-bonus-enabled=${SIGNUP_BONUS_ENABLED:false}
app.financial.signup-bonus-cents=${SIGNUP_BONUS_CENTS:10000}
# Render terminates TLS at its proxy. Tomcat resolves the client address from
# forwarded headers only when the immediate peer is a trusted internal proxy.
server.forward-headers-strategy=native

# Redis-backed authentication rate limits. Set SPRING_DATA_REDIS_URL to the
# private Render Key Value URL in production (redis://... or rediss://...).
spring.data.redis.url=${REDIS_URL}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

app.rate-limit.enabled=true
app.rate-limit.namespace=ratelimit:v1
app.rate-limit.login-ip.capacity=${RATE_LIMIT_LOGIN_IP_CAPACITY:10}
app.rate-limit.login-ip.refill-tokens=${RATE_LIMIT_LOGIN_IP_REFILL_TOKENS:10}
app.rate-limit.login-ip.refill-period=${RATE_LIMIT_LOGIN_IP_REFILL_PERIOD:1m}
app.rate-limit.login-account.capacity=${RATE_LIMIT_LOGIN_ACCOUNT_CAPACITY:5}
app.rate-limit.login-account.refill-tokens=${RATE_LIMIT_LOGIN_ACCOUNT_REFILL_TOKENS:5}
app.rate-limit.login-account.refill-period=${RATE_LIMIT_LOGIN_ACCOUNT_REFILL_PERIOD:15m}
app.rate-limit.signup-hour.capacity=${RATE_LIMIT_SIGNUP_HOUR_CAPACITY:3}
app.rate-limit.signup-hour.refill-tokens=${RATE_LIMIT_SIGNUP_HOUR_REFILL_TOKENS:3}
app.rate-limit.signup-hour.refill-period=${RATE_LIMIT_SIGNUP_HOUR_REFILL_PERIOD:1h}
app.rate-limit.signup-day.capacity=${RATE_LIMIT_SIGNUP_DAY_CAPACITY:10}
app.rate-limit.signup-day.refill-tokens=${RATE_LIMIT_SIGNUP_DAY_REFILL_TOKENS:10}
app.rate-limit.signup-day.refill-period=${RATE_LIMIT_SIGNUP_DAY_REFILL_PERIOD:1d}
app.rate-limit.trade.capacity=${RATE_LIMIT_TRADE_CAPACITY:30}
app.rate-limit.trade.refill-tokens=${RATE_LIMIT_TRADE_REFILL_TOKENS:30}
app.rate-limit.trade.refill-period=${RATE_LIMIT_TRADE_REFILL_PERIOD:1m}
app.rate-limit.withdraw.capacity=${RATE_LIMIT_WITHDRAW_CAPACITY:3}
app.rate-limit.withdraw.refill-tokens=${RATE_LIMIT_WITHDRAW_REFILL_TOKENS:3}
app.rate-limit.withdraw.refill-period=${RATE_LIMIT_WITHDRAW_REFILL_PERIOD:1m}
app.rate-limit.transfer.capacity=${RATE_LIMIT_TRANSFER_CAPACITY:10}
app.rate-limit.transfer.refill-tokens=${RATE_LIMIT_TRANSFER_REFILL_TOKENS:10}
app.rate-limit.transfer.refill-period=${RATE_LIMIT_TRANSFER_REFILL_PERIOD:1m}
app.rate-limit.fund-request.capacity=${RATE_LIMIT_FUND_REQUEST_CAPACITY:3}
app.rate-limit.fund-request.refill-tokens=${RATE_LIMIT_FUND_REQUEST_REFILL_TOKENS:3}
app.rate-limit.fund-request.refill-period=${RATE_LIMIT_FUND_REQUEST_REFILL_PERIOD:1h}
app.rate-limit.admin-financial.capacity=${RATE_LIMIT_ADMIN_FINANCIAL_CAPACITY:20}
app.rate-limit.admin-financial.refill-tokens=${RATE_LIMIT_ADMIN_FINANCIAL_REFILL_TOKENS:20}
app.rate-limit.admin-financial.refill-period=${RATE_LIMIT_ADMIN_FINANCIAL_REFILL_PERIOD:1m}
app.rate-limit.admin-market-write.capacity=${RATE_LIMIT_ADMIN_MARKET_WRITE_CAPACITY:10}
app.rate-limit.admin-market-write.refill-tokens=${RATE_LIMIT_ADMIN_MARKET_WRITE_REFILL_TOKENS:10}
app.rate-limit.admin-market-write.refill-period=${RATE_LIMIT_ADMIN_MARKET_WRITE_REFILL_PERIOD:1m}
app.rate-limit.admin-market-resolve.capacity=${RATE_LIMIT_ADMIN_MARKET_RESOLVE_CAPACITY:3}
app.rate-limit.admin-market-resolve.refill-tokens=${RATE_LIMIT_ADMIN_MARKET_RESOLVE_REFILL_TOKENS:3}
app.rate-limit.admin-market-resolve.refill-period=${RATE_LIMIT_ADMIN_MARKET_RESOLVE_REFILL_PERIOD:1m}
app.rate-limit.public-market-list.capacity=${RATE_LIMIT_PUBLIC_MARKET_LIST_CAPACITY:120}
app.rate-limit.public-market-list.refill-tokens=${RATE_LIMIT_PUBLIC_MARKET_LIST_REFILL_TOKENS:120}
app.rate-limit.public-market-list.refill-period=${RATE_LIMIT_PUBLIC_MARKET_LIST_REFILL_PERIOD:1m}
app.rate-limit.public-quote.capacity=${RATE_LIMIT_PUBLIC_QUOTE_CAPACITY:60}
app.rate-limit.public-quote.refill-tokens=${RATE_LIMIT_PUBLIC_QUOTE_REFILL_TOKENS:60}
app.rate-limit.public-quote.refill-period=${RATE_LIMIT_PUBLIC_QUOTE_REFILL_PERIOD:1m}
app.rate-limit.public-news.capacity=${RATE_LIMIT_PUBLIC_NEWS_CAPACITY:30}
app.rate-limit.public-news.refill-tokens=${RATE_LIMIT_PUBLIC_NEWS_REFILL_TOKENS:30}
app.rate-limit.public-news.refill-period=${RATE_LIMIT_PUBLIC_NEWS_REFILL_PERIOD:1m}

# === secrets ===
# Never commit secret values. They come from environment variables in prod,
# or from ./local-secrets.properties (gitignored) when running locally.
spring.config.import=optional:file:./local-secrets.properties
app.jwt.secret=${JWT_SECRET:}
# Uses a distinct production secret when configured; local development may
# fall back to JWT_SECRET. Enrollment fails closed if the key is under 32 bytes.
app.mfa.encryption-key=${MFA_ENCRYPTION_KEY:${JWT_SECRET:}}

# Set to true to send real emails via Brevo; false just logs them
app.mail.enabled=false

# Mail (SMTP) settings - use dot notation in properties files
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

news.api.key=${NEWS_API_KEY:}