spring.application.name=fantasy-betting-app
# === datasource (dev) ===
spring.datasource.url=jdbc:postgresql://localhost:5432/betting
spring.datasource.username=postgres
spring.datasource.password=yourpass

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=test
spring.security.user.password=testpass
# (optional) app port
server.port=8080

# Render terminates TLS at its proxy. Tomcat resolves the client address from
# forwarded headers only when the immediate peer is a trusted internal proxy.
server.forward-headers-strategy=native

# Redis-backed authentication rate limits. Set SPRING_DATA_REDIS_URL to the
# private Render Key Value URL in production (redis://... or rediss://...).
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

app.rate-limit.enabled=true
app.rate-limit.namespace=ratelimit:v1
app.rate-limit.login-ip.capacity=${RATE_LIMIT_LOGIN_IP_CAPACITY:10}
app.rate-limit.login-ip.refill-tokens=${RATE_LIMIT_LOGIN_IP_REFILL_TOKENS:10}
app.rate-limit.login-ip.refill-period=${RATE_LIMIT_LOGIN_IP_REFILL_PERIOD:1m}
app.rate-limit.login-account.capacity=${RATE_LIMIT_LOGIN_ACCOUNT_CAPACITY:5}
app.rate-limit.login-account.refill-tokens=${RATE_LIMIT_LOGIN_ACCOUNT_REFILL_TOKENS:5}
app.rate-limit.login-account.refill-period=${RATE_LIMIT_LOGIN_ACCOUNT_REFILL_PERIOD:15m}
app.rate-limit.signup-hour.capacity=${RATE_LIMIT_SIGNUP_HOUR_CAPACITY:3}
app.rate-limit.signup-hour.refill-tokens=${RATE_LIMIT_SIGNUP_HOUR_REFILL_TOKENS:3}
app.rate-limit.signup-hour.refill-period=${RATE_LIMIT_SIGNUP_HOUR_REFILL_PERIOD:1h}
app.rate-limit.signup-day.capacity=${RATE_LIMIT_SIGNUP_DAY_CAPACITY:10}
app.rate-limit.signup-day.refill-tokens=${RATE_LIMIT_SIGNUP_DAY_REFILL_TOKENS:10}
app.rate-limit.signup-day.refill-period=${RATE_LIMIT_SIGNUP_DAY_REFILL_PERIOD:1d}

# === secrets ===
# Never commit secret values. They come from environment variables in prod,
# or from ./local-secrets.properties (gitignored) when running locally.
spring.config.import=optional:file:./local-secrets.properties
app.jwt.secret=${JWT_SECRET:}

# Set to true to send real emails via Brevo; false just logs them
app.mail.enabled=false

# Mail (SMTP) settings - use dot notation in properties files
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

news.api.key=${NEWS_API_KEY:}