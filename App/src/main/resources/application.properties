spring.application.name=fantasy-betting-app
# === datasource (dev) ===
spring.datasource.url=jdbc:postgresql://localhost:5432/betting
spring.datasource.username=postgres
spring.datasource.password=yourpass

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=test
spring.security.user.password=testpass
# (optional) app port
server.port=8080

# === secrets ===
# Never commit secret values. They come from environment variables in prod,
# or from ./local-secrets.properties (gitignored) when running locally.
spring.config.import=optional:file:./local-secrets.properties
app.jwt.secret=${JWT_SECRET:}

# Set to true to send real emails via Brevo; false just logs them
app.mail.enabled=false

# Mail (SMTP) settings - use dot notation in properties files
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

news.api.key=${NEWS_API_KEY:}