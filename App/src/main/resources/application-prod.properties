# Production starts only when every secret and external endpoint below exists.
# Hikari uses a least-privileged, non-owner runtime role.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DATABASE_RUNTIME_USERNAME}
spring.datasource.password=${DATABASE_RUNTIME_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:2}
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30

# Flyway uses a distinct schema-owning role only while migrations run.
spring.flyway.enabled=true
spring.flyway.url=${SPRING_DATASOURCE_URL}
spring.flyway.user=${DATABASE_MIGRATION_USERNAME}
spring.flyway.password=${DATABASE_MIGRATION_PASSWORD}
spring.flyway.placeholders.runtimeRole=${DATABASE_RUNTIME_USERNAME}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-migration-naming=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET}
app.mfa.encryption-key=${MFA_ENCRYPTION_KEY}
app.security.allowed-origins=${APP_ALLOWED_ORIGINS}
app.security.cookie-name=betauth
app.security.cookie-secure=true
app.security.cookie-same-site=Lax
app.security.jwt-lifetime=15m
app.security.jwt-issuer=${JWT_ISSUER}
app.security.jwt-audience=${JWT_AUDIENCE}

# Distributed limits are mandatory in production; startup requires REDIS_URL.
app.rate-limit.enabled=true
spring.data.redis.url=${REDIS_URL}

server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=native
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=20s
server.tomcat.max-keep-alive-requests=100
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

app.mail.enabled=false
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
news.api.key=${NEWS_API_KEY:}

# Disabled by default: enabling this grants ordinary transferable wallet credit to every signup.
# Set SIGNUP_BONUS_ENABLED=true only as a deliberate production rollout decision.
app.financial.signup-bonus-enabled=${SIGNUP_BONUS_ENABLED:false}
app.financial.signup-bonus-cents=${SIGNUP_BONUS_CENTS:10000}